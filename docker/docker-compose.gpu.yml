# ==============================================================================
# Docker Compose GPU Override cho BabyCare AI
# ------------------------------------------------------------------------------
# Cách chạy khi có GPU:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build -d
# ==============================================================================

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
      args:
        CUDA_VERSION: 12.1.1-runtime-ubuntu22.04
        MODEL_VERSION: v1.0.0
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DEVICE=cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
