# ==============================================================================
# PRODUCTION OVERRIDE DOCKER COMPOSE CHO BABYCARE AI
# ==============================================================================
# Cấu hình tối ưu cho môi trường Production:
#   1. Tắt Hot-Reload, chạy mã nguồn đã đóng gói tĩnh trong Docker image
#   2. Khởi chạy qua kịch bản tiền khởi động an toàn (/app/scripts/prestart.sh)
#   3. Giới hạn tài nguyên (CPU & RAM) ngăn tràn bộ nhớ
#   4. Khóa port Redis (không mở ra ngoài Internet, chỉ truy cập qua mạng nội bộ)
#   5. Giới hạn dung lượng Log Rotation (tối đa 50MB/file)
# ==============================================================================

services:
  backend:
    environment:
      - APP_ENV=production
      - DEBUG=false
      - LOG_LEVEL=warning
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4096M
        reservations:
          cpus: '0.5'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  redis:
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
