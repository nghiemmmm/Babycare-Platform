# ==============================================================================
# NGINX REVERSE PROXY & API GATEWAY CONFIGURATION FOR BABYCARE AI
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Global upload & timeout configurations
    client_max_body_size 100M; # Hỗ trợ upload file ghi âm tiếng khóc và tài liệu PDF y tế

    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Standard Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Common Proxy Forwarding Headers (Tương thích Rate Limiter & Real IP detection)
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --------------------------------------------------
    # ROUTING RULES
    # --------------------------------------------------

    # 1. Vite React 19 Static Assets Caching
    location /assets/ {
        proxy_pass http://frontend_service;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 2. AI Server-Sent Events (SSE) Streaming Optimization
    # Endpoint phản hồi chữ chạy thời gian thực (typing effect) cho Chat Agent
    location ~ ^/api/v1/ai-agent/chat-stream {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
    }

    # 3. FastAPI Backend REST API Gateway
    location /api/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
    }

    # 4. WebSockets Realtime Gateway
    location /ws/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # 5. Static Files (Baby Avatars & Audio Recordings)
    location /static/ {
        proxy_pass http://backend_service/static/;
        proxy_http_version 1.1;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 6. Backend Health Check Endpoint
    location /health {
        proxy_pass http://backend_service/health;
        proxy_http_version 1.1;
    }

    # 7. Swagger API Documentation UI
    location /docs {
        proxy_pass http://backend_service/api/docs;
        proxy_http_version 1.1;
    }

    # 8. ReDoc API Documentation UI
    location /redoc {
        proxy_pass http://backend_service/api/redoc;
        proxy_http_version 1.1;
    }

    # 9. OpenAPI Schema JSON
    location /openapi.json {
        proxy_pass http://backend_service/api/openapi.json;
        proxy_http_version 1.1;
    }

    # 10. Frontend React Application (Default Route)
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}