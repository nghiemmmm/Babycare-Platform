# ==============================================================================
# GLOBAL NGINX SERVER CONFIGURATION - BABYCARE AI
# ==============================================================================

# Automatically match number of worker processes to available CPU cores
worker_processes auto;

# Path to the main PID file
pid /var/run/nginx.pid;

# Logging settings
error_log /var/log/nginx/error.log warn;

events {
    # Max simultaneous connections per worker process
    worker_connections 4096;
    # Accept multiple connections simultaneously
    multi_accept on;
    # Use the epoll event method on Linux
    use epoll;
}

http {
    # Include standard mime.types mapping
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format definitions with upstream response time & latency
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off; # Hide Nginx version for security

    # Global Gzip Compression settings
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Upstream Backend API Service
    upstream backend_service {
        server backend:8000;
        keepalive 32;
    }

    # Upstream Frontend React/Vite Service
    upstream frontend_service {
        server frontend:3000;
        keepalive 32;
    }

    # Include specific server configuration blocks
    include /etc/nginx/conf.d/*.conf;
}
