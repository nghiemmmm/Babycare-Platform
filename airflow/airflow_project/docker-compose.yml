version: '3.8'

x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: airflow_project/Dockerfile
  environment:
    - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
    - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
    - AIRFLOW__CORE__FERNET_KEY=${AIRFLOW__CORE__FERNET_KEY:-46BKJoPlCSetupYourFernetKeyHere123456789=}
    - AIRFLOW__CORE__LOAD_EXAMPLES=False
    - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    - DATABASE_URL=sqlite:////opt/airflow/data/rag_app.db
    - SQLITE_DB_PATH=/opt/airflow/data/rag_app.db
    - UPLOAD_DIR=/opt/airflow/data/uploads
    - PYTHONPATH=/opt/airflow
  volumes:
    - ./dags:/opt/airflow/dags
    - ../shared:/opt/airflow/airflow/shared
    - shared_data:/opt/airflow/data
    - ./logs:/opt/airflow/logs

services:
  airflow-init:
    <<: *airflow-common
    container_name: babycare-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME:-admin}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD:-admin}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@babycare.ai || true
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: babycare-airflow-webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: babycare-airflow-scheduler
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  ingestion-service:
    build:
      context: ..
      dockerfile: airflow_project/Dockerfile.service
    container_name: babycare-ingestion-api
    environment:
      - DATABASE_URL=sqlite:////opt/airflow/data/rag_app.db
      - SQLITE_DB_PATH=/opt/airflow/data/rag_app.db
      - UPLOAD_DIR=/opt/airflow/data/uploads
      - AIRFLOW_API_URL=http://airflow-webserver:8080/api/v1
      - AIRFLOW_USERNAME=${_AIRFLOW_WWW_USER_USERNAME:-admin}
      - AIRFLOW_PASSWORD=${_AIRFLOW_WWW_USER_PASSWORD:-admin}
      - TRIGGER_DAG_NAME=ingest_documents_dag
    ports:
      - "${INGESTION_SERVICE_PORT:-8000}:8000"
    volumes:
      - ../shared:/app/airflow/shared
      - shared_data:/opt/airflow/data
    restart: unless-stopped

volumes:
  shared_data:
